<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS施策レポート自動生成</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Upload Section */
        .upload-section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
            border-width: 3px;
            transform: scale(1.02);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.95em;
            margin-bottom: 20px;
        }

        .file-list {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9ff;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ddd;
        }

        .file-item.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .file-item.error {
            background: #ffebee;
            border-left-color: #f44336;
        }

        /* Client Info Section */
        .client-info {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-pdf {
            background: #ff6b6b;
            color: white;
        }

        .btn-pdf:hover:not(:disabled) {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        /* Report Section */
        .report-section {
            display: none;
            margin-top: 30px;
        }

        .report-section.active {
            display: block;
        }

        .report-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .report-header {
            text-align: center;
            border-bottom: 3px solid #667eea;
            padding-bottom: 30px;
            margin-bottom: 40px;
        }

        .report-header h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .report-header p {
            color: #666;
            font-size: 0.95em;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            color: #999;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .platform-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .charts-grid.full {
            grid-template-columns: 1fr;
        }

        .chart-wrapper {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e0e0ff;
        }

        .chart-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Summary Stats */
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-change {
            font-size: 0.85em;
            color: #999;
            margin-top: 8px;
        }

        .stat-change.positive {
            color: #2e7d32;
        }

        .stat-change.negative {
            color: #c62828;
        }

        /* Insights */
        .insights-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 30px;
            border-radius: 12px;
            margin-top: 40px;
        }

        .insights-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
        }

        .insight-text {
            font-size: 0.95em;
            line-height: 1.8;
            color: #444;
            text-align: left;
        }

        .insight-bullet {
            margin: 15px 0;
            padding-left: 25px;
            position: relative;
        }

        .insight-bullet::before {
            content: "→";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .summary-stats {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
        }

        @media print {
            body {
                background: white;
            }
            .upload-section,
            .client-info,
            .button-group,
            .loading {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 SNS施策レポート自動生成</h1>
        </div>

        <!-- Upload Section -->
        <div class="upload-section">
            <h2 style="margin-bottom: 20px; color: #333;">ステップ1: CSVファイルをアップロード</h2>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">CSVファイルをドラッグ&ドロップ</div>
                <div class="upload-subtext">または下のボタンをクリック</div>
                <button style="background: #667eea; color: white; margin-top: 15px;" onclick="document.getElementById('fileInput').click()">
                    ファイルを選択
                </button>
                <input type="file" id="fileInput" accept=".csv" multiple>
            </div>
            <div class="file-list" id="fileList" style="display: none;">
                <h3>アップロード済みファイル:</h3>
                <div id="fileListContent"></div>
            </div>
        </div>

        <!-- Client Info Section -->
        <div class="client-info">
            <h2 style="margin-bottom: 20px; color: #333;">ステップ2: レポート情報を入力</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="clientName">クライアント名</label>
                    <input type="text" id="clientName" placeholder="例: dip BATTLES">
                </div>
                <div class="form-group">
                    <label for="generatedDate">レポート生成日</label>
                    <input type="date" id="generatedDate">
                </div>
            </div>

            <div class="button-group">
                <button class="btn-generate" id="generateBtn">レポートを生成</button>
                <button class="btn-reset" id="resetBtn">リセット</button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>レポートを生成中...</p>
        </div>

        <!-- Report Section -->
        <div class="report-section" id="reportSection">
            <div class="report-container" id="reportContent">
                <!-- Report will be generated here -->
            </div>
            <div class="button-group" style="margin-top: 30px;">
                <button class="btn-pdf" id="downloadPdfBtn">PDFでダウンロード</button>
                <button class="btn-reset" id="resetBtn2">別のレポートを作成</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize
        document.getElementById('generatedDate').valueAsDate = new Date();

        let uploadedData = {};
        let chartsInstances = [];

        // Upload Area
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('dragenter', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const fileListContent = document.getElementById('fileListContent');
            fileListContent.innerHTML = '';
            uploadedData = {};

            if (files.length === 0) return;

            Array.from(files).forEach((file) => {
                if (!file.name.endsWith('.csv')) {
                    const item = document.createElement('div');
                    item.className = 'file-item error';
                    item.innerHTML = `<span>${file.name}</span><span>❌ CSV形式ではありません</span>`;
                    fileListContent.appendChild(item);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const csv = e.target.result;
                        const platform = detectPlatform(file.name);
                        const data = parseCsv(csv, platform);
                        uploadedData[platform] = data;

                        const item = document.createElement('div');
                        item.className = 'file-item success';
                        item.innerHTML = `<span>${file.name}</span><span>✅ ${platform} - ${data.length}行のデータ</span>`;
                        fileListContent.appendChild(item);
                    } catch (error) {
                        const item = document.createElement('div');
                        item.className = 'file-item error';
                        item.innerHTML = `<span>${file.name}</span><span>❌ パースエラー</span>`;
                        fileListContent.appendChild(item);
                    }
                };
                reader.readAsText(file);
            });

            document.getElementById('fileList').style.display = 'block';
        }

        function detectPlatform(filename) {
            if (filename.includes('IG')) return 'Instagram';
            if (filename.includes('TT')) return 'TikTok';
            if (filename.includes('YT')) return 'YouTube';
            return 'Unknown';
        }

        function parseCsv(csv, platform) {
            const lines = csv.trim().split('\n');
            const result = [];

            // TikTokの場合は「■ TikTok 全体 分析」の部分だけを抽出
            let startLine = 0;
            let endLine = lines.length;

            if (platform === 'TikTok') {
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('■ TikTok 全体 分析')) {
                        startLine = i;
                    }
                    if (i > startLine && lines[i].includes('■ TikTok') && !lines[i].includes('■ TikTok 全体')) {
                        endLine = i;
                        break;
                    }
                }
            }

            // Find header row
            let headerIndex = -1;
            for (let i = startLine; i < endLine; i++) {
                const line = lines[i];
                if (line.includes('年月') || (line.includes('月') && line.includes('投稿'))) {
                    headerIndex = i;
                    break;
                }
            }

            if (headerIndex === -1) {
                throw new Error('ヘッダー行が見つかりません');
            }

            // CSVパーサー（ダブルクォート対応）
            function parseCSVLine(line) {
                const result = [];
                let current = '';
                let insideQuotes = false;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    const nextChar = line[i + 1];

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            current += '"';
                            i++;
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        result.push(current.trim().replace(/["■]/g, ''));
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim().replace(/["■]/g, ''));
                return result;
            }

            const headers = parseCSVLine(lines[headerIndex]);

            // Parse data rows
            for (let i = headerIndex + 1; i < endLine; i++) {
                const line = lines[i].trim();
                if (!line || line.match(/^[■,]*$/) || !line.match(/^\d{4}/) && !line.match(/^\d{1,2}\//)) continue;

                const values = parseCSVLine(line);
                if (values.length < 2) continue;

                const obj = {};
                headers.forEach((header, idx) => {
                    obj[header] = values[idx] || '';
                });

                result.push(obj);
            }

            return result;
        }

        // Generate Report
        document.getElementById('generateBtn').addEventListener('click', generateReport);
        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('resetBtn2').addEventListener('click', reset);

        async function generateReport() {
            const clientName = document.getElementById('clientName').value || 'クライアント';
            const generatedDate = document.getElementById('generatedDate').value;

            if (Object.keys(uploadedData).length === 0) {
                alert('CSVファイルをアップロードしてください');
                return;
            }

            document.getElementById('loading').classList.add('active');

            chartsInstances.forEach(chart => chart.destroy());
            chartsInstances = [];

            setTimeout(async () => {
                try {
                    const report = await createReport(clientName, uploadedData, generatedDate);
                    document.getElementById('reportContent').innerHTML = report;
                    document.getElementById('reportSection').classList.add('active');
                    document.getElementById('loading').classList.remove('active');

                    await initializeCharts();

                    document.getElementById('downloadPdfBtn').onclick = () => {
                        downloadPdf(clientName, generatedDate);
                    };
                } catch (error) {
                    alert('レポート生成エラー: ' + error.message);
                    document.getElementById('loading').classList.remove('active');
                }
            }, 500);
        }

        async function createReport(clientName, data, date) {
            let html = `
                <div class="report-header">
                    <h2>${clientName}</h2>
                    <p>SNS施策レポート</p>
                    <p style="font-size: 0.9em; margin-top: 10px;">作成日: ${new Date(date).toLocaleDateString('ja-JP')}</p>
                </div>

                <div class="tabs">
            `;

            Object.keys(data).forEach((platform, index) => {
                html += `<button class="tab-btn ${index === 0 ? 'active' : ''}" onclick="switchTab('${platform}')">${platform}</button>`;
            });

            html += '</div>';

            for (const [platform, rows] of Object.entries(data)) {
                const isActive = Object.keys(data)[0] === platform;
                html += `<div class="tab-content ${isActive ? 'active' : ''}" id="tab-${platform}">`;
                html += await generatePlatformReport(platform, rows);
                html += '</div>';
            }

            return html;
        }

        async function generatePlatformReport(platform, rows) {
            if (!rows || rows.length === 0) return '<p>データがありません</p>';

            const sortedRows = [...rows].reverse();
            let metrics = getMetricsForPlatform(platform, sortedRows);

            const insights = generateInsights(platform, metrics);
            const stats = getSummaryStats(platform, metrics);

            let html = `
                <div class="platform-title">${platform}</div>

                <div class="summary-stats">
                    ${stats.map(stat => `
                        <div class="stat-card">
                            <div class="stat-label">${stat.label}</div>
                            <div class="stat-value">${stat.value}</div>
                            <div class="stat-change ${stat.change > 0 ? 'positive' : 'negative'}">
                                ${stat.change > 0 ? '↑' : '↓'} ${Math.abs(stat.change)}${stat.unit}
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="charts-grid${platform === 'YouTube' ? ' full' : ''}">
                    ${metrics.charts.map(chart => `
                        <div class="chart-wrapper">
                            <div class="chart-title">${chart.title}</div>
                            <div class="chart-container">
                                <canvas id="chart-${chart.id}-${platform}"></canvas>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="insights-section">
                    <div class="insights-title">📈 分析と考察</div>
                    <div class="insight-text">${insights}</div>
                </div>
            `;

            return html;
        }

        function getMetricsForPlatform(platform, sortedRows) {
            let metrics = {
                dates: [],
                data: {},
                charts: [],
                raw: sortedRows
            };

            if (platform === 'Instagram') {
                metrics.data = {
                    投稿数: [],
                    合計リーチ: [],
                    合計新規リーチ: [],
                    平均再生: [],
                    新規率: []
                };
                metrics.charts = [
                    { id: 'posts', title: '投稿数の推移' },
                    { id: 'reach', title: '合計リーチの推移' },
                    { id: 'new-reach', title: '合計新規リーチの推移' },
                    { id: 'avg-views', title: '平均再生の推移' },
                    { id: 'new-rate', title: '新規率の推移' }
                ];

                sortedRows.forEach(row => {
                    metrics.dates.push(row['年月']);
                    metrics.data['投稿数'].push(parseInt(row['投稿数']) || 0);
                    metrics.data['合計リーチ'].push(parseInt(row['合計リーチ'].toString().replace(/,/g, '')) || 0);
                    metrics.data['合計新規リーチ'].push(parseInt(row['合計新規リーチ'].toString().replace(/,/g, '')) || 0);
                    metrics.data['平均再生'].push(parseInt(row['平均再生'].toString().replace(/,/g, '')) || 0);
                    metrics.data['新規率'].push(parseFloat(row['新規率'].toString().replace(/%/g, '')) || 0);
                });

            } else if (platform === 'TikTok') {
                metrics.data = {
                    投稿数: [],
                    合計リーチ: [],
                    合計新規リーチ: [],
                    平均再生: []
                };
                metrics.charts = [
                    { id: 'posts', title: '投稿数の推移' },
                    { id: 'reach', title: '合計リーチの推移' },
                    { id: 'new-reach', title: '合計新規リーチの推移' },
                    { id: 'avg-views', title: '平均再生の推移' }
                ];

                sortedRows.forEach(row => {
                    metrics.dates.push(row['年月']);
                    metrics.data['投稿数'].push(parseInt(row['投稿数']) || 0);
                    metrics.data['合計リーチ'].push(parseInt(row['合計リーチ'].toString().replace(/,/g, '')) || 0);
                    metrics.data['合計新規リーチ'].push(parseInt(row['合計新規リーチ'].toString().replace(/,/g, '')) || 0);
                    metrics.data['平均再生'].push(parseInt(row['平均再生'].toString().replace(/,/g, '')) || 0);
                });

            } else if (platform === 'YouTube') {
                metrics.data = {
                    投稿本数: [],
                    再生数: [],
                    インプレッション数: [],
                    'クリック率': [],
                    平均視聴時間: []
                };
                metrics.charts = [
                    { id: 'posts', title: '投稿本数の推移' },
                    { id: 'views', title: '再生数の推移' },
                    { id: 'impressions', title: 'インプレッション数の推移' },
                    { id: 'ctr', title: 'インプレッションクリック率の推移' },
                    { id: 'watch-time', title: '平均視聴時間の推移' }
                ];

                // YouTubeは昇順（古い順）にする
                const youtubeRows = [...sortedRows].reverse();
                
                youtubeRows.forEach(row => {
                    metrics.dates.push(row['月']);
                    metrics.data['投稿本数'].push(parseInt(row['投稿本数'].toString().replace(/本/g, '')) || 0);
                    metrics.data['再生数'].push(parseInt(row['再生数'].toString().replace(/,/g, '')) || 0);
                    metrics.data['インプレッション数'].push(parseInt(row['インプレッション数'].toString().replace(/,/g, '')) || 0);
                    metrics.data['クリック率'].push(parseFloat(row['インプレッションクリック率'].toString().replace(/%/g, '')) || 0);
                    
                    const watchTime = row['平均視聴時間'];
                    let minutes = 0;
                    if (watchTime && watchTime.toString().includes('分')) {
                        minutes = parseFloat(watchTime.toString().replace(/分/g, ''));
                    }
                    metrics.data['平均視聴時間'].push(minutes);
                });
            }

            return metrics;
        }

        function getSummaryStats(platform, metrics) {
            let stats = [];
            const dataKeys = Object.keys(metrics.data);

            dataKeys.forEach(key => {
                const values = metrics.data[key];
                if (values.length === 0) return;

                const latest = values[values.length - 1];
                const previous = values[values.length - 2] || latest;

                let changeVal = 0;
                let unit = '';

                if (key.includes('率') || key === 'クリック率') {
                    changeVal = (latest - previous).toFixed(1);
                    unit = '%';
                } else {
                    changeVal = previous ? ((latest - previous) / previous * 100).toFixed(1) : 0;
                    unit = '%';
                }

                let displayValue = latest;
                if (key === '平均視聴時間') {
                    displayValue = latest.toFixed(1) + '分';
                } else if (key === 'クリック率') {
                    displayValue = latest.toFixed(1) + '%';
                } else if (key.includes('率')) {
                    displayValue = latest.toFixed(1) + '%';
                } else {
                    displayValue = formatNumber(Math.round(latest));
                }

                stats.push({
                    label: key + '（先月比）',
                    value: displayValue,
                    change: parseFloat(changeVal),
                    unit: unit
                });
            });

            return stats;
        }

        function generateInsights(platform, metrics) {
            let insights = '<div class="insight-bullet">';

            if (platform === 'Instagram') {
                const posts = metrics.data['投稿数'];
                const reach = metrics.data['合計リーチ'];
                const postsChange = ((posts[posts.length - 1] - posts[posts.length - 2]) / posts[posts.length - 2] * 100).toFixed(1);
                const reachChange = ((reach[reach.length - 1] - reach[reach.length - 2]) / reach[reach.length - 2] * 100).toFixed(1);

                if (Math.abs(postsChange) > 20) {
                    insights += `今月は投稿数が${postsChange}%${postsChange > 0 ? '増加' : '減少'}し、リーチも${reachChange}%${reachChange > 0 ? '増加' : '減少'}しました。投稿頻度とリーチの関係が強く表れています。`;
                } else {
                    insights += `投稿数は安定していますが、リーチは${reachChange}%の変化を示しました。コンテンツの質的改善を検討してください。`;
                }
            } else if (platform === 'TikTok') {
                const reach = metrics.data['合計リーチ'];
                const newReach = metrics.data['合計新規リーチ'];
                const newReachRate = (newReach[newReach.length - 1] / reach[reach.length - 1] * 100).toFixed(1);

                insights += `先月のリーチは${formatNumber(reach[reach.length - 1])}で、そのうち${newReachRate}%が新規ユーザーからのアクセスです。新規ユーザーの獲得が順調に進んでいます。`;
            } else if (platform === 'YouTube') {
                const views = metrics.data['再生数'];
                const watchTime = metrics.data['平均視聴時間'];
                const ctr = metrics.data['クリック率'];

                insights += `今月の総再生数は${formatNumber(views[views.length - 1])}で、平均視聴時間は${watchTime[watchTime.length - 1].toFixed(1)}分です。インプレッションクリック率は${ctr[ctr.length - 1].toFixed(1)}%と${ctr[ctr.length - 1] > ctr[ctr.length - 2] ? '改善' : '低下'}しました。`;
            }

            insights += '</div><div class="insight-bullet">';
            insights += `引き続きデータを監視し、エンゲージメント向上のための施策を実施してください。`;
            insights += '</div>';

            return insights;
        }

        async function initializeCharts() {
            for (const [platform, rows] of Object.entries(uploadedData)) {
                const sortedRows = [...rows].reverse();
                const metrics = getMetricsForPlatform(platform, sortedRows);

                const colors = {
                    Instagram: '#E1306C',
                    TikTok: '#000000',
                    YouTube: '#FF0000'
                };

                const color = colors[platform] || '#667eea';

                // Create charts for each metric
                metrics.charts.forEach(chart => {
                    const canvasId = `chart-${chart.id}-${platform}`;
                    const canvas = document.getElementById(canvasId);
                    
                    if (!canvas) return;

                    let dataKey = '';
                    if (chart.id === 'posts') dataKey = platform === 'YouTube' ? '投稿本数' : '投稿数';
                    else if (chart.id === 'reach') dataKey = '合計リーチ';
                    else if (chart.id === 'new-reach') dataKey = '合計新規リーチ';
                    else if (chart.id === 'avg-views') dataKey = '平均再生';
                    else if (chart.id === 'new-rate') dataKey = '新規率';
                    else if (chart.id === 'views') dataKey = '再生数';
                    else if (chart.id === 'impressions') dataKey = 'インプレッション数';
                    else if (chart.id === 'ctr') dataKey = 'クリック率';
                    else if (chart.id === 'watch-time') dataKey = '平均視聴時間';

                    const data = metrics.data[dataKey] || [];

                    const chartInstance = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels: metrics.dates,
                            datasets: [{
                                label: chart.title,
                                data: data,
                                borderColor: color,
                                backgroundColor: color + '20',
                                tension: 0.4,
                                fill: true,
                                pointRadius: 5,
                                pointBackgroundColor: color
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true } }
                        }
                    });
                    chartsInstances.push(chartInstance);
                });
            }
        }

        function switchTab(platform) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${platform}`).classList.add('active');
        }

        function formatNumber(num) {
            if (typeof num !== 'number') num = parseInt(num) || 0;
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function downloadPdf(clientName, date) {
            const element = document.getElementById('reportContent');
            const opt = {
                margin: 15,
                filename: `${clientName}_SNSレポート_${date}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function reset() {
            uploadedData = {};
            chartsInstances.forEach(chart => chart.destroy());
            chartsInstances = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('fileList').style.display = 'none';
            document.getElementById('fileListContent').innerHTML = '';
            document.getElementById('reportSection').classList.remove('active');
            document.getElementById('clientName').value = '';
            document.getElementById('generatedDate').valueAsDate = new Date();
            window.scrollTo(0, 0);
        }
    </script>
</body>
